stages:
  preprocess:
    cmd: python -m src.preprocess --config configs/forecast_detection/preprocess.json
    deps:
      - external_data/detection_rates/metr_public_evals_all_runs.jsonl
      - src/preprocess.py
      - configs/forecast_detection/preprocess.json
    outs:
      - data/processed/forecast_detection/processed_data.csv

  model_ability_regression:
    cmd: python -m src.model_ability_regression --input data/processed/forecast_detection/processed_data.csv --output data/processed/forecast_detection/logistic_fit_results.json
    deps:
      - data/processed/forecast_detection/processed_data.csv
      - src/model_ability_regression.py
    outs:
      - data/processed/forecast_detection/logistic_fit_results.json

  forecast_ability:
    cmd: python -m src.forecast_ability --params data/processed/forecast_detection/logistic_fit_results.json --config configs/forecast_detection/forecast_ability.json --out data/processed/forecast_detection/ability_forecasts.csv
    deps:
      - data/processed/forecast_detection/logistic_fit_results.json
      - configs/forecast_detection/forecast_ability.json
      - src/forecast_ability.py
    outs:
      - data/processed/forecast_detection/ability_forecasts.csv

  forecast_cost:
    cmd: python -m src.forecast_cost --input data/processed/forecast_detection/processed_data.csv --out data/processed/forecast_detection/cost_trends.csv
    deps:
      - data/processed/forecast_detection/processed_data.csv
      - src/forecast_cost.py
    outs:
      - data/processed/forecast_detection/cost_trends.csv

  forecast_evaluation:
    cmd: python -m src.forecast_evaluation --ability data/processed/forecast_detection/ability_forecasts.csv --cost data/processed/forecast_detection/cost_trends.csv --out data/processed/forecast_detection/evaluation_forecasts.csv
    deps:
      - data/processed/forecast_detection/ability_forecasts.csv
      - data/processed/forecast_detection/cost_trends.csv
      - src/forecast_evaluation.py
    outs:
      - data/processed/forecast_detection/evaluation_forecasts.csv

  forecast_simulation:
    cmd: python -m src.forecast_simulation --in data/processed/forecast_detection/evaluation_forecasts.csv --out data/processed/forecast_detection/simulation_results.csv --raw data/processed/forecast_detection/raw_simulation_results.h5 --config configs/forecast_simulation.json
    deps:
      - data/processed/forecast_detection/evaluation_forecasts.csv
      - src/forecast_simulation.py
      - configs/forecast_simulation.json
      - src/simulation.py
    outs:
      - data/processed/forecast_detection/simulation_results.csv
      - data/processed/forecast_detection/raw_simulation_results.h5

  explore_logistic_fits:
    cmd: python -m src.tools.explore_logistic_fits --fits data/processed/forecast_detection/logistic_fit_results.json --data data/processed/forecast_detection/processed_data.csv --output reports/forecast_detection/logistic_fit_visualizations
    deps:
      - data/processed/forecast_detection/logistic_fit_results.json
      - data/processed/forecast_detection/processed_data.csv
      - src/tools/explore_logistic_fits.py
    outs:
      - reports/forecast_detection/logistic_fit_visualizations

  explore_ability_forecasts:
    cmd: python -m src.tools.explore_ability_forecasts --input data/processed/forecast_detection/ability_forecasts.csv --output reports/forecast_detection/ability_visualizations
    deps:
      - data/processed/forecast_detection/ability_forecasts.csv
      - src/tools/explore_ability_forecasts.py
    outs:
      - reports/forecast_detection/ability_visualizations

  explore_cost_trends:
    cmd: python -m src.tools.explore_cost_trends --trends data/processed/forecast_detection/cost_trends.csv --forecasts data/processed/forecast_detection/cost_forecasts.csv --output reports/forecast_detection/cost_visualizations
    deps:
      - data/processed/forecast_detection/cost_trends.csv
      - data/processed/forecast_detection/cost_forecasts.csv
      - src/tools/explore_cost_trends.py
    outs:
      - reports/forecast_detection/cost_visualizations

  explore_evaluation_forecasts:
    cmd: python -m src.tools.explore_evaluation_forecasts --input data/processed/forecast_detection/evaluation_forecasts.csv --output reports/forecast_detection/evaluation_visualizations
    deps:
      - data/processed/forecast_detection/evaluation_forecasts.csv
      - src/tools/explore_evaluation_forecasts.py
    outs:
      - reports/forecast_detection/evaluation_visualizations

  explore_simulations:
    cmd: python -m src.tools.explore_simulations --raw data/processed/forecast_detection/raw_simulation_results.h5 --output reports/forecast_detection/exploration_results.csv --debug
    deps:
      - data/processed/forecast_detection/raw_simulation_results.h5
      - src/explore_simulations.py
    outs:
      - reports/forecast_detection/exploration_results.csv

  plot_reports:
    cmd: python -m scripts.plot_forecasts --inputs "data/processed/forecast_detection/*.csv" --out reports/forecast_detection/figures/
    deps:
      - data/processed/forecast_detection/
      - scripts/plot_forecasts.py
    outs:
      - reports/forecast_detection/figures/
    metrics:
      - reports/forecast_detection/figures/*.png
