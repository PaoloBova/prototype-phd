params:
  - ../params.yaml

vars:
  - ../params.yaml

stages:
  preprocess:
    wdir: ..
    cmd: python -m src.preprocess --config configs/forecast_detection/preprocess.json
    deps:
      - external_data/detection_rates/metr_public_evals_all_runs.jsonl
      - src/preprocess.py
      - configs/forecast_detection/preprocess.json
    outs:
      - output/forecast_detection/processed_data.csv

  model_ability_regression:
    wdir: ..
    cmd: python -m src.model_ability_regression --input output/forecast_detection/processed_data.csv --output output/forecast_detection/logistic_fit_results.json
    deps:
      - output/forecast_detection/processed_data.csv
      - src/model_ability_regression.py
    outs:
      - output/forecast_detection/logistic_fit_results.json

  forecast_ability:
    wdir: ..
    cmd: python -m src.forecast_ability --params output/forecast_detection/logistic_fit_results.json --config configs/forecast_detection/forecast_ability.json --out output/forecast_detection/ability_forecasts.csv
    deps:
      - output/forecast_detection/logistic_fit_results.json
      - configs/forecast_detection/forecast_ability.json
      - src/forecast_ability.py
    outs:
      - output/forecast_detection/ability_forecasts.csv

  forecast_cost:
    wdir: ..
    cmd: python -m src.forecast_cost --input output/forecast_detection/processed_data.csv --out output/forecast_detection/cost_trends.csv --config configs/forecast_detection/forecast_cost.json
    deps:
      - output/forecast_detection/processed_data.csv
      - configs/forecast_detection/forecast_cost.json
      - src/forecast_cost.py
    outs:
      - output/forecast_detection/cost_trends.csv
      - output/forecast_detection/cost_forecasts.csv

  forecast_evaluation:
    wdir: ..
    cmd: python -m src.forecast_evaluation --ability output/forecast_detection/ability_forecasts.csv --cost output/forecast_detection/cost_trends.csv --out ${output_dirs.data}/evaluation_forecasts.json --sweep-config ${exp.forecast_evaluation_config}
    params:
      - exp.forecast_evaluation_config
      - output_dirs.data
    deps:
      - output/forecast_detection/ability_forecasts.csv
      - output/forecast_detection/cost_trends.csv
      - ${exp.forecast_evaluation_config}
      - src/forecast_evaluation.py
    outs:
      - ${output_dirs.data}/evaluation_forecasts.json

  forecast_simulation:
    wdir: ..
    cmd: python -m src.forecast_simulation --in ${output_dirs.data}/evaluation_forecasts.json --out ${output_dirs.data}/simulation_results.csv --raw ${output_dirs.data}/raw_simulation_results.h5 --config configs/forecast_detection/forecast_simulation.json --n-jobs 6
    params:
      - output_dirs.data
    deps:
      - ${output_dirs.data}/evaluation_forecasts.json
      - src/forecast_simulation.py
      - configs/forecast_detection/forecast_simulation.json
      - src/simulation.py
      - src/schemas.py
      - src/alternate_ability.py
    outs:
      - ${output_dirs.data}/simulation_results.csv
      - ${output_dirs.data}/raw_simulation_results.h5

  explore_logistic_fits:
    wdir: ..
    cmd: python -m src.tools.explore_logistic_fits --fits output/forecast_detection/logistic_fit_results.json --data output/forecast_detection/processed_data.csv --output reports/forecast_detection/logistic_fit_visualizations
    deps:
      - output/forecast_detection/logistic_fit_results.json
      - output/forecast_detection/processed_data.csv
      - src/tools/explore_logistic_fits.py
    outs:
      - reports/forecast_detection/logistic_fit_visualizations

  explore_ability_forecasts:
    wdir: ..
    cmd: python -m src.tools.explore_ability_forecasts --input output/forecast_detection/ability_forecasts.csv --output reports/forecast_detection/ability_visualizations --font-size 24 --disable-titles
    deps:
      - output/forecast_detection/ability_forecasts.csv
      - src/tools/explore_ability_forecasts.py
    outs:
      - reports/forecast_detection/ability_visualizations

  explore_cost_trends:
    wdir: ..
    cmd: python -m src.tools.explore_cost_trends --trends output/forecast_detection/cost_trends.csv --forecasts output/forecast_detection/cost_forecasts.csv --output reports/forecast_detection/cost_visualizations --font-size 24 --disable-titles
    deps:
      - output/forecast_detection/cost_trends.csv
      - output/forecast_detection/cost_forecasts.csv
      - src/tools/explore_cost_trends.py
    outs:
      - reports/forecast_detection/cost_visualizations

  explore_evaluation_forecasts:
    wdir: ..
    cmd: python -m src.tools.explore_evaluation_forecasts --input ${output_dirs.data}/evaluation_forecasts.json --output ${output_dirs.reports}/evaluation_visualizations --font-size 24 --disable-titles
    params:
      - output_dirs.data
      - output_dirs.reports
    deps:
      - ${output_dirs.data}/evaluation_forecasts.json
      - src/tools/explore_evaluation_forecasts.py
    outs:
      - ${output_dirs.reports}/evaluation_visualizations

  explore_simulations:
    wdir: ..
    cmd: python -m src.tools.explore_simulations --raw ${output_dirs.data}/raw_simulation_results.h5 --output ${output_dirs.reports}/exploration_results --font-size 24 --disable-titles --config ${exp.explore_simulations_config}
    params:
      - exp.explore_simulations_config
      - output_dirs.data
      - output_dirs.reports
    deps:
      - ${output_dirs.data}/raw_simulation_results.h5
      - src/tools/explore_simulations.py
      - ${exp.explore_simulations_config}
    outs:
      - ${output_dirs.reports}/exploration_results

  analyze_bias:
    wdir: ..
    cmd: python -m src.tools.analyze_bias --input ${output_dirs.data}/simulation_results.csv --output ${output_dirs.reports}/bias_analysis --remove-outliers
    params:
      - output_dirs.data
      - output_dirs.reports
    deps:
      - ${output_dirs.data}/simulation_results.csv
      - src/tools/analyze_bias.py
    outs:
      - ${output_dirs.reports}/bias_analysis

  plot_reports:
    wdir: ..
    cmd: python -m scripts.plot_forecasts --inputs "${output_dirs.data}/*.csv" --out ${output_dirs.reports}/figures/
    params:
      - output_dirs.data
      - output_dirs.reports
    deps:
      - ${output_dirs.data}/
      - scripts/plot_forecasts.py
    outs:
      - ${output_dirs.reports}/figures/
